<main id="main">
  <section class="page-head">
    <canvas class="hero-net" id="hero-net" aria-hidden="true"></canvas>

      <nav class="crumbs" aria-label="現在地"><a href="./">ホーム</a><span aria-hidden="true">/</span><span aria-current="page">ご相談・お見積り</span></nav>
      <p class="eyebrow">Contact</p>
      <h1>ご相談・お見積り</h1>
      <p class="page-lead">仕様が決まっていなくても大丈夫です。やりたいことを一言いただければ、進め方からご提案します。ご相談・お見積りは無料です。</p>
    </div>
  </section>

  <section class="section contact" id="contact" aria-labelledby="contact-title">
    <div class="wrap contact-grid">
      <div class="section-head">
        <h2 id="contact-title">お問い合わせフォーム</h2>
        <p class="section-lead">項目をご入力のうえ、送信してください。内容を確認して、こちらからご連絡します。</p>
        <p class="contact-mail">メール：<span class="mono" data-profile="email">nagatoyukiza1234@gmail.com</span> <button class="copy" type="button" id="copy-mail">コピー</button></p>
        <p class="contact-profile" id="contact-profile" hidden></p>
      </div>
      <form class="contact-form" id="contact-form" novalidate>
        <input type="hidden" name="_subject" value="【ポートフォリオ】ご相談・お見積り">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="field"><label for="f-name">お名前・会社名</label><input id="f-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="f-email">メールアドレス</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="f-service">ご相談内容</label><select id="f-service" name="service"></select></div>
        <div class="field"><label for="f-message">詳細（目的・時期・ご予算など）</label><textarea id="f-message" name="message" rows="5" required></textarea></div>
        <button class="btn btn-primary" type="submit">送信する</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </section>
</main>
